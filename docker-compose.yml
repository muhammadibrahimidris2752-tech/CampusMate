# Local development dependencies ONLY — Postgres + Redis, matching the
# defaults in .env.example. Not a production deployment manifest (Step 12
# deliberately avoids Kubernetes/orchestration at this stage; production
# Postgres/Redis are expected to be managed services).
#
# Usage:
#   docker compose up -d      # start both
#   docker compose down       # stop both (add -v to also wipe data volumes)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nigerian_student_platform_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
